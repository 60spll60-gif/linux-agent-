# Linux 巡检看板 — Nginx 反向代理 + HTTPS
# 安装位置: /etc/nginx/conf.d/inspect.conf（或 sites-available + 软链）
#
# 使用前请全局替换占位域名：
#   sed -i 's/inspect.example.com/你的域名/g' inspect.conf

# ── HTTP：仅用于 Let's Encrypt 验证，其余全部跳转 HTTPS ──
server {
    listen 80;
    listen [::]:80;
    server_name inspect.example.com;

    # certbot 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS：反代到本机 8000 端口的 FastAPI ──
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inspect.example.com;

    # 证书由 certbot 自动签发并续期
    ssl_certificate     /etc/letsencrypt/live/inspect.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inspect.example.com/privkey.pem;

    # TLS 加固
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 看板与 API 的登录鉴权由应用层 Basic Auth 完成
    # （INSPECT_DASHBOARD_USER / INSPECT_DASHBOARD_PASS），此处只做转发
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 上报接口单独限流，防止被刷（每台 Agent 5 分钟一次，正常远低于此）
    location /report {
        limit_req zone=inspect_report burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 单次上报体不大，限制 1MB 足够
        client_max_body_size 1m;
    }
}
