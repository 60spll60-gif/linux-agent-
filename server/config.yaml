# 中央服务器配置
server:
  host: "0.0.0.0"
  port: 8000
  # Agent 上报鉴权 token，需与 agent/config.yaml 的 server.token 一致
  token: "my-secret-token"
  # 看板 / API 的 HTTP Basic 登录账号。
  # 留空＝不启用鉴权，任何人都能打开看板（只适合本机调试）。
  # 生产环境请用环境变量 INSPECT_DASHBOARD_USER / INSPECT_DASHBOARD_PASS 注入，
  # 不要把真实密码提交进版本库。
  dashboard_user: ""
  dashboard_pass: ""

# 数据库路径
db_path: "inspect.db"

# 数据保留天数（超过自动清理）
data_retention_days: 30

# ── 看板配置 ──────────────────────────────────────────
# 这里的每一项都会通过 GET /api/config 下发给前端，
# 前端不自己写死阈值，改这个文件重启服务即可生效。
dashboard:
  # 前端自动轮询间隔（秒）。注意这是「页面拉数据」的频率，不是 Agent 采集频率
  refresh_seconds: 30

  # 超过多少分钟没上报就判定为「离线」。
  # 建议设为 Agent 采集间隔（agent/config.yaml 的 interval）的 3 倍，
  # 默认 15 = 5 分钟 × 3。改了 Agent 间隔记得同步改这里。
  offline_minutes: 15

  # 卡片 sparkline 回溯时长（小时）
  history_hours: 6

  # 状态判定阈值（百分比）
  thresholds:
    cpu_warn: 80
    cpu_err: 95
    mem_warn: 85
    mem_err: 95
    disk_warn: 90
    disk_err: 98
    # 失败服务「个数」：达到 warn 判警告，达到 err 判严重
    failed_warn: 1
    failed_err: 4
